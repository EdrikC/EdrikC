  </text>

  <!-- Divider -->
  <line x1="64" y1="220" x2="1136" y2="220"
        stroke="#30343A"
        stroke-width="1"/>

  <!-- Signature -->
  <text x="1136" y="314"
        class="primary"
        font-size="24"
        font-weight="700"
        text-anchor="end"
